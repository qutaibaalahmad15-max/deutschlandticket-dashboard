
<video
  id="myVideo"
  autoplay
  muted
  loop
  playsinline
  webkit-playsinline
  disablepictureinpicture
  controlslist="nodownload nofullscreen noremoteplayback"
>
  <source src="./a8daef6b-92e9-4dbb-9583-42453b396195.mov" type="video/quicktime">
</video>

<script>
const video = document.getElementById("myVideo");

video.controls = false;

video.play().catch(() => {
  document.addEventListener("touchstart", () => {
    video.play();
  }, { once: true });
});
</script>
