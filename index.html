
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>Meine Uhr</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border: 0;
  pointer-events: none;
  -webkit-user-select: none;
  user-select: none;
}
</style>
</head>

<body>

<video
  id="clock"
  autoplay
  muted
  loop
  playsinline
  webkit-playsinline
  disablepictureinpicture
  controlslist="nodownload noplaybackrate nofullscreen"
>
  <source src="./a8daef6b-92e9-4dbb-9583-42453b396195.mov" type="video/quicktime">
</video>

<script>
const video = document.getElementById("clock");

video.controls = false;

video.play().catch(() => {
  console.log("Automatischer Start wurde vom Browser verhindert.");
});
</script>

</body>
</html>
